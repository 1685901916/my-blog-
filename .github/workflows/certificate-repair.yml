name: Certificate Repair

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/certificate-repair.yml

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Issue and install ayano29.cn certificate
        uses: appleboy/ssh-action@v1
        with:
          host: 38.76.169.35
          username: root
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          fingerprint: SHA256:B0UTPbr5lNkpfSnRg6/QrVa6yYCZCUlU9lffmKQIsiU
          command_timeout: 10m
          script: |
            set -euo pipefail

            DOMAIN="ayano29.cn"
            WEBROOT="/www/wwwroot/blog"
            CERT_DIR="/www/server/panel/vhost/cert/$DOMAIN"
            SITE_CONFIG="/www/server/panel/vhost/nginx/$DOMAIN.conf"
            ACME="/root/.acme.sh/acme.sh"
            NGINX="/www/server/nginx/sbin/nginx"
            BACKUP_ROOT="/root/cert-backups"
            BACKUP_DIR="$BACKUP_ROOT/$DOMAIN-$(date +%Y%m%d-%H%M%S)"
            SUCCESS=0

            rollback() {
              status=$?
              if [ "$SUCCESS" -ne 1 ]; then
                echo "Repair failed; restoring certificate backup."
                if [ -d "$BACKUP_DIR/cert" ]; then
                  rm -rf "$CERT_DIR"
                  cp -a "$BACKUP_DIR/cert" "$CERT_DIR"
                fi
                if [ -f "$BACKUP_DIR/site.conf" ]; then
                  cp -a "$BACKUP_DIR/site.conf" "$SITE_CONFIG"
                fi
                "$NGINX" -t && "$NGINX" -s reload || true
              fi
              exit "$status"
            }
            trap rollback EXIT

            test -x "$ACME"
            test -x "$NGINX"
            test -d "$WEBROOT"
            test -d "$CERT_DIR"
            test -f "$SITE_CONFIG"

            echo "=== preflight ==="
            "$NGINX" -t
            openssl x509 -in "$CERT_DIR/fullchain.pem" -noout -subject -issuer -dates

            echo "=== backup ==="
            mkdir -p "$BACKUP_ROOT" "$BACKUP_DIR"
            chmod 700 "$BACKUP_ROOT" "$BACKUP_DIR"
            cp -a "$CERT_DIR" "$BACKUP_DIR/cert"
            cp -a "$SITE_CONFIG" "$BACKUP_DIR/site.conf"
            echo "BACKUP_DIR=$BACKUP_DIR"

            ACME_CERT="/root/.acme.sh/${DOMAIN}_ecc/fullchain.cer"
            ACME_KEY="/root/.acme.sh/${DOMAIN}_ecc/${DOMAIN}.key"

            echo "=== issue ==="
            if [ -s "$ACME_CERT" ] &&
               [ -s "$ACME_KEY" ] &&
               openssl x509 -checkend 2592000 -noout -in "$ACME_CERT"; then
              echo "Reusing the valid certificate already issued by acme.sh."
            else
              "$ACME" --issue \
                --server letsencrypt \
                --webroot "$WEBROOT" \
                --domain "$DOMAIN" \
                --keylength ec-256
            fi

            test -s "$ACME_CERT"
            test -s "$ACME_KEY"
            openssl x509 -in "$ACME_CERT" -noout -subject -issuer -dates
            openssl x509 -checkend 2592000 -noout -in "$ACME_CERT"

            echo "=== install ==="
            "$ACME" --install-cert \
              --domain "$DOMAIN" \
              --ecc \
              --key-file "$CERT_DIR/privkey.pem" \
              --fullchain-file "$CERT_DIR/fullchain.pem" \
              --reloadcmd "$NGINX -t && $NGINX -s reload"

            echo "=== verify on server ==="
            "$NGINX" -t
            openssl x509 -in "$CERT_DIR/fullchain.pem" -noout \
              -subject -issuer -dates -fingerprint -sha256
            TLS_OUTPUT="$(
              echo |
                openssl s_client \
                  -connect 127.0.0.1:443 \
                  -servername "$DOMAIN" \
                  -CAfile "$CERT_DIR/fullchain.pem" \
                  -verify_return_error 2>&1
            )"
            echo "$TLS_OUTPUT" | grep -E 'subject=|issuer=|Verify return code' || true
            echo "$TLS_OUTPUT" | grep -q 'Verify return code: 0 (ok)'
            "$ACME" --list | grep "$DOMAIN"

            SUCCESS=1
            trap - EXIT
            echo "Certificate repair completed successfully."
