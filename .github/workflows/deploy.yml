name: Deploy to Pages Branch

on:
  # 每次推送到 `main` 分支时触发这个"工作流程"
  # 如果你使用了别的分支名，请按需将 `main` 替换成你的分支名
  push:
    branches: [ main ]
  # 允许你在 GitHub 上的 Actions 标签中手动触发此"工作流程"
  workflow_dispatch:

# 需要写入权限来推送到pages分支
permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v4
        with:
          submodules: true  # 支持 Git Submodule 模式
          token: ${{ secrets.GITHUB_TOKEN }}  # 自动访问同账号下的私有仓库
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.22.0
          run_install: false
          
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
        env:
          SHARP_IGNORE_GLOBAL_LIBVIPS: 1
      
      - name: Build site
        run: pnpm run build
        env:
          # 如果需要启用内容分离,取消以下注释并配置
          # ENABLE_CONTENT_SYNC: true
          # CONTENT_REPO_URL: ${{ secrets.CONTENT_REPO_URL }}
          # USE_SUBMODULE: true
          
          # 其他环境变量
          UMAMI_API_KEY: ${{ secrets.UMAMI_API_KEY }}
      
      - name: Verify build output
        run: |
          echo "Checking build output..."
          ls -lh dist/
          echo "Build size:"
          du -sh dist/
          echo "Critical files check:"
          test -f dist/index.html && echo "✓ index.html exists" || echo "✗ index.html missing"
          test -f dist/404.html && echo "✓ 404.html exists" || echo "✗ 404.html missing"
          test -d dist/_astro && echo "✓ _astro directory exists" || echo "✗ _astro directory missing"
          test -d dist/pagefind && echo "✓ pagefind directory exists" || echo "✗ pagefind directory missing"

      - name: Deploy to pages branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: pages
          folder: dist
          clean: true

      - name: Deploy to Server via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT }}
          source: "dist/*"
          target: "/tmp/blog-deploy-${{ github.sha }}"
          strip_components: 1
          rm: false
          debug: true
          overwrite: true

      - name: Deploy files and set permissions
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            set -e

            echo "=========================================="
            echo "开始部署到服务器"
            echo "=========================================="

            TEMP_DIR="/tmp/blog-deploy-${{ github.sha }}"
            WEB_DIR="/www/wwwroot/blog"
            BACKUP_DIR="/www/backups/blog-$(date +%Y%m%d-%H%M%S)"

            echo "1. 检查临时目录..."
            if [ ! -d "$TEMP_DIR" ]; then
              echo "错误: 临时目录不存在: $TEMP_DIR"
              exit 1
            fi
            echo "临时目录内容:"
            ls -lh "$TEMP_DIR" | head -10

            echo ""
            echo "2. 创建 Web 目录（如果不存在）..."
            mkdir -p "$WEB_DIR"

            echo ""
            echo "3. 备份当前网站..."
            if [ "$(ls -A $WEB_DIR 2>/dev/null)" ]; then
              mkdir -p /www/backups
              cp -r "$WEB_DIR" "$BACKUP_DIR"
              echo "备份已创建: $BACKUP_DIR"
            else
              echo "Web 目录为空，跳过备份"
            fi

            echo ""
            echo "4. 清理旧文件..."
            rm -rf "$WEB_DIR"/*

            echo ""
            echo "5. 复制新文件..."
            cp -r "$TEMP_DIR"/* "$WEB_DIR"/

            echo ""
            echo "6. 设置权限..."
            # 解锁 .user.ini 文件（宝塔面板保护机制）
            if [ -f "$WEB_DIR/.user.ini" ]; then
              chattr -i "$WEB_DIR/.user.ini" 2>/dev/null || true
            fi
            chmod -R 755 "$WEB_DIR"
            chown -R www:www "$WEB_DIR"
            # 重新锁定 .user.ini 文件
            if [ -f "$WEB_DIR/.user.ini" ]; then
              chattr +i "$WEB_DIR/.user.ini" 2>/dev/null || true
            fi

            echo ""
            echo "7. 清理临时文件..."
            rm -rf "$TEMP_DIR"

            echo ""
            echo "8. 验证部署..."
            echo "Web 目录内容:"
            ls -lh "$WEB_DIR" | head -10

            echo ""
            echo "关键文件检查:"
            for file in index.html 404.html _astro pagefind; do
              if [ -e "$WEB_DIR/$file" ]; then
                echo "✓ $file 存在"
              else
                echo "✗ $file 不存在"
              fi
            done

            echo ""
            echo "文件修改时间:"
            stat "$WEB_DIR/index.html" | grep Modify || stat "$WEB_DIR/index.html" | grep Change

            echo ""
            echo "=========================================="
            echo "✅ 部署完成于 $(date '+%Y-%m-%d %H:%M:%S')"
            echo "=========================================="
            echo "Web 目录: $WEB_DIR"
            echo "备份目录: $BACKUP_DIR"
            echo "Git commit: ${{ github.sha }}"
